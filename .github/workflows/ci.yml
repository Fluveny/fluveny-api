# CI: segredos, build, testes, contrato (oasdiff), o workflow de publicação contra uma API efêmera
# e o build da imagem em todo PR e em todo push na main. A imagem só é publicada no GHCR em push na
# main, e aí o job "Deploy em homologação" chama o deploy hook do Render com a imagem do commit.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Só os commits novos; qualquer achado falha. O achado antigo do histórico
      # fica listado por fingerprint na .gitleaksignore.
      # Se o commit anterior do push não está no clone (primeiro push, force
      # push), varre o histórico inteiro e avisa.
      - name: Gitleaks nos commits novos
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::Commit base $BASE fora do clone; varrendo o histórico inteiro."
            RANGE="HEAD"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --log-opts="$RANGE" --redact --verbose --no-banner

  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Java 25 e lefthook, nas versões do mise.toml.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # A mesma tarefa que o dev roda (NFR13): formatação (spotless:check),
      # unitários (surefire), verificação do Spring Modulith (ModularityTest) e
      # integração (failsafe, *IT). O Mongo dos ITs vem do Testcontainers.
      - name: mise run check
        run: mise run check

  contract:
    name: Contrato
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Só mudanças aditivas no /api/v1 (AD-11). Em PR, compara com a main; na
      # main, com o commit anterior (HEAD~1 se o `before` não está no clone).
      # Sem contrato na base (o PR que cria o arquivo), não há o que comparar. O OpenApiContractTest, no job de build,
      # garante que o arquivo é o /v3/api-docs do código.
      - name: oasdiff breaking
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::Commit base $BASE fora do clone; comparando com o commit anterior (HEAD~1)."
            BASE="HEAD~1"
          fi
          if ! git show "$BASE:openapi/openapi.json" > "$RUNNER_TEMP/base-openapi.json" 2>/dev/null; then
            echo "::notice::Sem openapi/openapi.json em $BASE; nada a comparar."
            exit 0
          fi
          docker run --rm -v "$RUNNER_TEMP:/base" -v "$PWD/openapi:/head" tufin/oasdiff:v1.38.0 \
            breaking /base/base-openapi.json /head/openapi.json --fail-on ERR \
            --severity-levels /head/oasdiff-levels.txt

  publish-workflow:
    name: Publicação (API efêmera)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      API_URL: http://localhost:8080
      EMPTY_API_URL: http://localhost:8081
      FIXTURE: src/test/resources/content-fixtures/publish-ci
    steps:
      - uses: actions/checkout@v4

      # O workflow publish-content.yml precisa ser válido antes de qualquer coisa.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color \
            .github/workflows/publish-content.yml .github/workflows/ci.yml \
            .github/workflows/keep-warm.yml

      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build do jar
        run: ./mvnw -B -ntp -q package -DskipTests

      # Token gerado no job, mascarado; a API recebe só o sha256 (Decisão 2).
      - name: Subir a API (perfil prod, mongo:8 do job)
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "FLUVENY_DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # Chave dos recibos (história 1.12), obrigatória em prod; gerada no job e mascarada.
          RECEIPT_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$RECEIPT_KEY"
          export FLUVENY_RECEIPT_KEY="$RECEIPT_KEY"
          # Origens da CORS (história 1.22), obrigatórias em prod; o job não usa navegador.
          export FLUVENY_WEB_ORIGINS=https://app.fluveny.test
          # Mínimo do App explícito (história 1.20): os Tipos têm sinceAppVersion 0.1.0, acima dele,
          # e é isso que faz o step "Recusas" receber 422 UNSUPPORTED_ACTIVITY_TYPE.
          export FLUVENY_MIN_APP_VERSION=0.0.0
          # Segredo de proxy (história 1.6), obrigatório em prod; gerado no job e mascarado. O
          # script e os curl abaixo o leem do ambiente, como o publish-content.yml.
          PROXY_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PROXY_SECRET"
          echo "FLUVENY_PROXY_SECRET=$PROXY_SECRET" >> "$GITHUB_ENV"
          export FLUVENY_PROXY_SECRET="$PROXY_SECRET"
          SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/fluveny_ci \
          FLUVENY_DEPLOY_TOKEN_SHA256="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)" \
            nohup java -jar target/fluveny-backend-*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          # Uma segunda API, com outro banco, faz o papel de um registro que não tem o hash.
          SERVER_PORT=8081 SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/fluveny_ci_empty \
          FLUVENY_DEPLOY_TOKEN_SHA256="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)" \
            nohup java -jar target/fluveny-backend-*.jar > "$RUNNER_TEMP/api-empty.log" 2>&1 &
          for url in "$API_URL" "$EMPTY_API_URL"; do
            for _ in $(seq 1 60); do
              if curl -fsS "$url/api/v1/meta" > /dev/null 2>&1; then continue 2; fi
              sleep 2
            done
            echo "::error::A API em $url não subiu."
            exit 1
          done

      # Os mesmos comandos dos jobs do publish-content.yml, com a API efêmera no
      # papel de homologação e de produção.
      - name: Homologação, publicar e republicar
        run: |
          node scripts/content-bundle.mjs publish unit-coming-soon --api "$API_URL" --content "$FIXTURE" | tee "$RUNNER_TEMP/first.txt"
          grep -q "versão nova" "$RUNNER_TEMP/first.txt"
          node scripts/content-bundle.mjs publish unit-coming-soon --api "$API_URL" --content "$FIXTURE" | tee "$RUNNER_TEMP/second.txt"
          grep -q "versão já existia" "$RUNNER_TEMP/second.txt"

      - name: Produção, candidata, registro e ponteiro
        run: |
          GITHUB_OUTPUT="$RUNNER_TEMP/candidate.out" \
            node scripts/content-bundle.mjs publish unit-coming-soon --api "$API_URL" --content "$FIXTURE" --publish false
          VERSION_ID="$(grep '^version-id=' "$RUNNER_TEMP/candidate.out" | cut -d= -f2)"
          grep -q '^published=true' "$RUNNER_TEMP/candidate.out" # já era a publicada
          node scripts/content-bundle.mjs check unit-coming-soon "$VERSION_ID" --api "$API_URL"
          GITHUB_OUTPUT="$RUNNER_TEMP/prod.out" \
            node scripts/content-bundle.mjs publish unit-coming-soon --api "$API_URL" --content "$FIXTURE"
          test "$(grep '^version-id=' "$RUNNER_TEMP/prod.out" | cut -d= -f2)" = "$VERSION_ID"

      - name: Recusas
        run: |
          # Hash fora da homologação: o check falha, e o job de produção pararia.
          if node scripts/content-bundle.mjs check unit-coming-soon "sha256:$(printf '0%.0s' $(seq 1 64))" --api "$API_URL"; then
            echo "::error::O check aceitou um hash inexistente."; exit 1
          fi
          # Os Tipos têm sinceAppVersion 0.1.0, acima do FLUVENY_MIN_APP_VERSION=0.0.0 desta API
          # (definido em "Subir a API"): 422 UNSUPPORTED_ACTIVITY_TYPE.
          if node scripts/content-bundle.mjs publish unit-1 --api "$API_URL" --content src/test/resources/content-fixtures/valid 2> "$RUNNER_TEMP/unsupported.txt"; then
            echo "::error::A publicação aceitou um Tipo acima da versão mínima do App."; exit 1
          fi
          grep -q UNSUPPORTED_ACTIVITY_TYPE "$RUNNER_TEMP/unsupported.txt"
          # Token errado: 401 (desde a 2.1, Bearer que ninguém reconhece deixa a requisição anônima).
          if FLUVENY_DEPLOY_TOKEN=errado node scripts/content-bundle.mjs publish unit-coming-soon --api "$API_URL" --content "$FIXTURE" 2> "$RUNNER_TEMP/forbidden.txt"; then
            echo "::error::A publicação aceitou um token errado."; exit 1
          fi
          grep -q "A API respondeu 401:" "$RUNNER_TEMP/forbidden.txt"
          grep -q "^UNAUTHENTICATED:" "$RUNNER_TEMP/forbidden.txt"
          # Sem o segredo de proxy (chamada direta ao host, pulando o Worker): 403.
          if FLUVENY_PROXY_SECRET='' node scripts/content-bundle.mjs publish unit-coming-soon --api "$API_URL" --content "$FIXTURE" 2> "$RUNNER_TEMP/no-proxy.txt"; then
            echo "::error::A publicação passou sem o segredo de proxy."; exit 1
          fi
          grep -q "A API respondeu 403:" "$RUNNER_TEMP/no-proxy.txt"
          grep -q "^ACCESS_DENIED:" "$RUNNER_TEMP/no-proxy.txt"

      - name: Candidata nova fica fora do ponteiro e do registro
        run: |
          PUBLISHED="$(grep '^version-id=' "$RUNNER_TEMP/prod.out" | cut -d= -f2)"
          CANDIDATE_DIR="$RUNNER_TEMP/candidate-content"
          cp -R "$FIXTURE" "$CANDIDATE_DIR"
          sed -i 's/"title": "Coming soon"/"title": "Coming soon, candidate"/' "$CANDIDATE_DIR/units/unit-coming-soon/unit.json"
          GITHUB_OUTPUT="$RUNNER_TEMP/new-candidate.out" \
            node scripts/content-bundle.mjs publish unit-coming-soon --api "$API_URL" --content "$CANDIDATE_DIR" --publish false
          grep -q '^created=true' "$RUNNER_TEMP/new-candidate.out"
          grep -q '^published=false' "$RUNNER_TEMP/new-candidate.out"
          CANDIDATE="$(grep '^version-id=' "$RUNNER_TEMP/new-candidate.out" | cut -d= -f2)"
          test "$CANDIDATE" != "$PUBLISHED"
          # O ponteiro continua na versão publicada.
          curl -fsS -H "X-Fluveny-Proxy: $FLUVENY_PROXY_SECRET" "$API_URL/api/v1/units/unit-coming-soon" | grep -q "\"versionId\":\"$PUBLISHED\""
          # A API que tem a candidata a acha; um registro sem ela recusa, e o job de produção pararia.
          node scripts/content-bundle.mjs check unit-coming-soon "$CANDIDATE" --api "$API_URL"
          if node scripts/content-bundle.mjs check unit-coming-soon "$CANDIDATE" --api "$EMPTY_API_URL" 2> "$RUNNER_TEMP/missing.txt"; then
            echo "::error::O check aceitou um hash que o registro não tem."; exit 1
          fi
          grep -q "não existe em $EMPTY_API_URL" "$RUNNER_TEMP/missing.txt"

      - name: O aluno vê a Unidade em breve
        run: |
          curl -fsS -H "X-Fluveny-Proxy: $FLUVENY_PROXY_SECRET" "$API_URL/api/v1/units" | tee "$RUNNER_TEMP/units.json"
          node -e 'const {data}=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if (data.length !== 1 || data[0].unitKey !== "unit-coming-soon" || data[0].comingSoon !== true) process.exit(1)' "$RUNNER_TEMP/units.json"

      - name: Log da API
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/api-empty.log"

  image:
    name: Imagem
    needs: [secrets, build, contract, publish-workflow]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Login só para publicar. Em PR a imagem é construída, sem push.
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke: a imagem sobe no perfil prod contra o mongo:8 do job e responde o /meta. Pega,
      # por exemplo, os schemas fora do classpath antes do deploy.
      - name: Build local para o smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: fluveny-api:smoke
          cache-from: type=gha

      # A chave dos recibos (história 1.12) e o segredo de proxy (história 1.6) são obrigatórios
      # em prod; gerados aqui e mascarados. As origens da CORS (história 1.22) também são
      # obrigatórias; o smoke não usa navegador. Sem o segredo, só o health check passa.
      - name: Smoke da imagem
        run: |
          FLUVENY_RECEIPT_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$FLUVENY_RECEIPT_KEY"
          export FLUVENY_RECEIPT_KEY
          FLUVENY_PROXY_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$FLUVENY_PROXY_SECRET"
          export FLUVENY_PROXY_SECRET
          docker run -d --name api-smoke --network host \
            -e SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/fluveny_smoke \
            -e FLUVENY_RECEIPT_KEY \
            -e FLUVENY_WEB_ORIGINS=https://app.fluveny.test \
            -e FLUVENY_PROXY_SECRET \
            fluveny-api:smoke
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          up=false
          for _ in $(seq 1 60); do
            if [ "$(status http://localhost:8080/api/v1/meta)" = "200" ]; then up=true; break; fi
            sleep 2
          done
          if [ "$up" != true ]; then
            docker logs api-smoke
            echo "::error::A imagem não respondeu 200 em /api/v1/meta."
            exit 1
          fi
          without="$(status http://localhost:8080/api/v1/units)"
          with="$(status -H "X-Fluveny-Proxy: $FLUVENY_PROXY_SECRET" http://localhost:8080/api/v1/units)"
          if [ "$without" != 403 ] || [ "$with" != 200 ]; then
            docker logs api-smoke
            echo "::error::/api/v1/units sem o segredo de proxy respondeu $without (esperado 403) e com ele, $with (esperado 200)."
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fluveny/fluveny-api
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy em homologação (história 1.6): o Render roda a imagem sha-<sha> do commit, nunca uma
  # main mais nova. O deploy hook fica só no secret RENDER_DEPLOY_HOOK_URL do Environment homolog;
  # sem ele, o job avisa e não falha. O Render faz o deploy depois de responder ao hook.
  deploy-homolog:
    name: Deploy em homologação
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homolog
    concurrency:
      group: deploy-homolog
      cancel-in-progress: false
    steps:
      - name: Deploy hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/fluveny/fluveny-api:sha-${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Sem o secret RENDER_DEPLOY_HOOK_URL no Environment homolog; deploy pulado."
            exit 0
          fi
          curl -fsS -o /dev/null -X POST -G --data-urlencode "imgURL=$IMAGE" "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy pedido ao Render: $IMAGE"
