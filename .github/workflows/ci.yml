# CI: segredos, build e testes em todo PR e em todo push na main; publicação
# da imagem no GHCR só em push na main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Só os commits novos. Os achados antigos da sprint9 (já sem uso) ficam
      # listados por fingerprint na .gitleaksignore; qualquer achado novo falha.
      - name: Gitleaks nos commits novos
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --log-opts="$RANGE" --redact --verbose --no-banner

  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unitários (surefire), verificação do Spring Modulith (ModularityTest) e
      # integração (failsafe, *IT). O Mongo dos ITs vem do Testcontainers.
      - name: Build e testes
        run: ./mvnw -B -ntp verify

  image:
    name: Imagem no GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fluveny/fluveny-api
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
