# CI: segredos, build, testes, contrato (oasdiff) e build da imagem em todo PR e em todo push na
# main. A imagem só é publicada no GHCR em push na main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Só os commits novos; qualquer achado falha. O achado antigo do histórico
      # fica listado por fingerprint na .gitleaksignore.
      # Se o commit anterior do push não está no clone (primeiro push, force
      # push), varre o histórico inteiro e avisa.
      - name: Gitleaks nos commits novos
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::Commit base $BASE fora do clone; varrendo o histórico inteiro."
            RANGE="HEAD"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --log-opts="$RANGE" --redact --verbose --no-banner

  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Java 25 e lefthook, nas versões do mise.toml.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # A mesma tarefa que o dev roda (NFR13): formatação (spotless:check),
      # unitários (surefire), verificação do Spring Modulith (ModularityTest) e
      # integração (failsafe, *IT). O Mongo dos ITs vem do Testcontainers.
      - name: mise run check
        run: mise run check

  contract:
    name: Contrato
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Só mudanças aditivas no /api/v1 (AD-11). Em PR, compara com a main; na
      # main, com o commit anterior (HEAD~1 se o `before` não está no clone).
      # Sem contrato na base (o PR que cria o arquivo), não há o que comparar. O OpenApiContractTest, no job de build,
      # garante que o arquivo é o /v3/api-docs do código.
      - name: oasdiff breaking
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::Commit base $BASE fora do clone; comparando com o commit anterior (HEAD~1)."
            BASE="HEAD~1"
          fi
          if ! git show "$BASE:openapi/openapi.json" > "$RUNNER_TEMP/base-openapi.json" 2>/dev/null; then
            echo "::notice::Sem openapi/openapi.json em $BASE; nada a comparar."
            exit 0
          fi
          docker run --rm -v "$RUNNER_TEMP:/base" -v "$PWD/openapi:/head" tufin/oasdiff:v1.38.0 \
            breaking /base/base-openapi.json /head/openapi.json --fail-on ERR

  image:
    name: Imagem
    needs: [secrets, build, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Login só para publicar. Em PR a imagem é construída, sem push.
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fluveny/fluveny-api
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
