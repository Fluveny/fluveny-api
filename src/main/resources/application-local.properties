# Perfil local (história 1.4, AD-18): só na máquina do dev. O LocalProfileGuard
# recusa este perfil junto com prod e com um Mongo que não seja local. No
# `mise run up`, o Mongo vem do Testcontainers (mongo:8 em replica set); no
# compose do App, de SPRING_DATA_MONGODB_URI (host mongo).

# LOCAL_SEED_PASSWORD e outras variáveis do dev, fora do git. Opcional: sem o
# arquivo, a API sobe do mesmo jeito.
spring.config.import=optional:file:./.env.local[.properties]

# Log legível no terminal, em vez do JSON (ECS) dos outros perfis.
logging.structured.format.console=

# CORS: o App web do `npx expo start --web`. Para o teste no aparelho, troque
# por FLUVENY_WEB_ORIGINS (no ambiente ou no .env.local), com o IP da máquina.
fluveny.web.origins=${FLUVENY_WEB_ORIGINS:http://localhost:8081}
