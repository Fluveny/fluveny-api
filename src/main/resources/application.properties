spring.application.name=fluveny-api

# Sem SPRING_PROFILES_ACTIVE, o perfil é prod (AD-18). O application-prod
# exige a URI do Mongo.
spring.profiles.default=prod

# A URI vem só do ambiente (NFR1), pela variável SPRING_DATA_MONGODB_URI. No
# Boot 4 a conexão fica em spring.mongodb.*; a spring.data.mongodb.uri é
# ignorada. Nos testes de integração, o Testcontainers fornece o Mongo.
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:}

# Segurança: sem o usuário e a senha gerados pelo Boot. A cadeia da platform é
# deny-by-default (AD-12).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Sem servir arquivos estáticos do classpath: caminho sem handler é 404.
spring.web.resources.add-mappings=false
# Mensagens da Bean Validation em pt-BR, independente do Accept-Language.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Logs em JSON (ECS), sem corpo de requisição nem cabeçalhos (NFR17).
logging.structured.format.console=ecs

# Sentry: só liga com SENTRY_DSN; sem PII (NFR17, SentryPiiScrubber). O SDK lê
# SENTRY_ENVIRONMENT sozinho; não há propriedade aqui para não forçar valor vazio.
sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false

# Documentação da API pública em todos os ambientes (história 1.2, Decisão 2).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Saída estável do contrato (AD-11): OpenAPI 3.1, chaves ordenadas, JSON
# indentado e application/json como media type padrão. O arquivo commitado fica
# em openapi/openapi.json e o OpenApiContractTest compara os dois.
springdoc.api-docs.version=openapi_3_1
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.default-produces-media-type=application/json
# Só o /api/v1 entra no contrato.
springdoc.paths-to-match=/api/v1/**

# Versão mínima do App (AD-11), devolvida em GET /api/v1/meta.
fluveny.app.min-version=${FLUVENY_MIN_APP_VERSION:0.0.0}

# Token de deploy do job "Publicar conteúdo" (história 1.7): só o sha256 dele,
# em hex. O token fica no GitHub Environment de cada ambiente. Sem a variável,
# toda publicação é negada e a API sobe normalmente.
fluveny.deploy.token-sha256=${FLUVENY_DEPLOY_TOKEN_SHA256:}

# Conteúdo Estruturado lido pelo carregador do perfil local (content/units e
# content/media.json), relativo ao diretório de trabalho.
fluveny.content.dir=${FLUVENY_CONTENT_DIR:content}
