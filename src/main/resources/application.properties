spring.application.name=fluveny-api

# Sem SPRING_PROFILES_ACTIVE, o perfil é prod (AD-18). O application-prod
# exige a URI do Mongo.
spring.profiles.default=prod

# A URI vem só do ambiente (NFR1), pela variável SPRING_DATA_MONGODB_URI. No
# Boot 4 a conexão fica em spring.mongodb.*; a spring.data.mongodb.uri é
# ignorada. Nos testes de integração, o Testcontainers fornece o Mongo.
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:}

# Segurança: sem o usuário e a senha gerados pelo Boot. A cadeia da platform é
# deny-by-default (AD-12).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Sem servir arquivos estáticos do classpath: caminho sem handler é 404.
spring.web.resources.add-mappings=false
# Mensagens da Bean Validation em pt-BR, independente do Accept-Language.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Logs em JSON (ECS), sem corpo de requisição nem cabeçalhos (NFR17).
logging.structured.format.console=ecs

# Sentry: só liga com SENTRY_DSN; sem PII (NFR17, SentryPiiScrubber). O SDK lê
# SENTRY_ENVIRONMENT sozinho; não há propriedade aqui para não forçar valor vazio.
sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false

# Documentação da API pública em todos os ambientes (história 1.2, Decisão 2).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Saída estável do contrato (AD-11): OpenAPI 3.1, chaves ordenadas, JSON
# indentado e application/json como media type padrão. O arquivo commitado fica
# em openapi/openapi.json e o OpenApiContractTest compara os dois.
springdoc.api-docs.version=openapi_3_1
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.default-produces-media-type=application/json
# Só o /api/v1 entra no contrato.
springdoc.paths-to-match=/api/v1/**

# Versão mínima do App (AD-11), devolvida em GET /api/v1/meta.
fluveny.app.min-version=${FLUVENY_MIN_APP_VERSION:0.0.0}

# Token de deploy do job "Publicar conteúdo" (história 1.7): só o sha256 dele,
# em hex. O token fica no GitHub Environment de cada ambiente. Sem a variável,
# toda publicação é negada e a API sobe normalmente.
fluveny.deploy.token-sha256=${FLUVENY_DEPLOY_TOKEN_SHA256:}

# Conteúdo Estruturado lido pelo carregador do perfil local (content/units e
# content/media.json), relativo ao diretório de trabalho.
fluveny.content.dir=${FLUVENY_CONTENT_DIR:content}

# Chave HMAC dos recibos do Visitante (história 1.12): base64, 32 bytes ou mais
# (openssl rand -base64 32). Obrigatória em prod (ProdEnvironmentGuard); fora de
# prod, sem a variável, a API gera uma chave na partida e avisa no log.
fluveny.receipt.key=${FLUVENY_RECEIPT_KEY:}
# Rotação (história 2.6): a chave anterior, no mesmo formato, só confere os
# recibos assinados antes da troca; nunca assina. Opcional.
fluveny.receipt.previous-key=${FLUVENY_RECEIPT_PREVIOUS_KEY:}

# Origens web aceitas pela CORS de /api/v1/** (história 1.22): o App do Aluno
# na web, separadas por vírgula, cada uma scheme://host[:porta], sem caminho,
# sem barra no fim e sem *. Obrigatória em prod (ProdEnvironmentGuard); fora de
# prod e do local, sem a variável, nenhuma origem web passa.
fluveny.web.origins=${FLUVENY_WEB_ORIGINS:}

# Limite de taxa das rotas /api/v1/visitor/** (Decisão 1 da história 1.12), em
# janela fixa de um minuto e em memória, por instância. O limite por IP vale
# também para /api/v1/auth/** (o cadastro da história 2.1), no mesmo contador.
fluveny.visitor.rate-limit.device-per-minute=30
fluveny.visitor.rate-limit.ip-per-minute=300

# Segredo de proxy (AD-18, história 1.6): o Worker da Cloudflare o envia em
# X-Fluveny-Proxy, e sem ele a API responde 403 (exceto GET /api/v1/meta, o
# health check). Gere com `openssl rand -hex 32`. Obrigatório em prod
# (ProdEnvironmentGuard); fora de prod, sem a variável, o filtro fica desligado.
fluveny.proxy.secret=${FLUVENY_PROXY_SECRET:}

# Endereço do App (história 2.2): base do link do e-mail de confirmação
# ({FLUVENY_APP_URL}/confirmar-email?token=...). Obrigatória em prod
# (ProdEnvironmentGuard).
fluveny.app.url=${FLUVENY_APP_URL:}

# E-mail (AD-15, história 2.2): todo envio passa pelo outbox mail_outbox, e um
# despacho agendado (a cada 30 s) envia por SMTP. O SMTP vem de SPRING_MAIL_HOST,
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD (o Boot lê
# sozinho), e o remetente de FLUVENY_MAIL_FROM. Sem o host ou o remetente, nada
# sai: os e-mails ficam PENDING e a partida avisa no log.
fluveny.mail.from=${FLUVENY_MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Cota diária de envio, contada pelos SENT do dia em America/Sao_Paulo
# [ASSUMPTION: plano grátis do Brevo]. Esgotada, o resto espera o dia seguinte.
fluveny.mail.daily-quota=${FLUVENY_MAIL_DAILY_QUOTA:300}
# Despacho agendado; os testes desligam e chamam o MailDispatcher direto.
fluveny.mail.dispatch.enabled=true

# As versões dos termos e da política em vigor, gravadas no consentimento do responsável
# (história 2.11). As mesmas que o App mostra (1.21); mude junto quando o texto mudar.
fluveny.legal.terms-version=${FLUVENY_TERMS_VERSION:0.3}
fluveny.legal.privacy-version=${FLUVENY_PRIVACY_VERSION:0.4}
